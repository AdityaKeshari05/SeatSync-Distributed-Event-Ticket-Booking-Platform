name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
    build-and-check:
        runs-on: ubuntu-latest
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

        strategy:
            matrix:
                service:
                    - services/auth_service
                    - services/event_service
                    - services/booking_service
                    - gateway
                    - frontend
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with: 
                node-version: '22'
                cache: 'npm'
                cache-dependency-path: ${{ matrix.service }}/package-lock.json
            
            - name: Install dependencies
              working-directory: ${{ matrix.service }}
              run: npm ci

            - name: Generate Prisma client (if applicable)
              working-directory: ${{ matrix.service }}
              run: |
                if [ -f "prisma/schema.prisma" ]; then
                  npx prisma generate
                else
                    echo "No Prisma schema found for ${{ matrix.service }}, skipping Prisma client generation."
                fi
            
            - name: Type check
              working-directory: ${{ matrix.service }}
              run: npx tsc --noEmit

            - name: Next.js build check
              if: matrix.service == 'frontend'
              working-directory: ${{ matrix.service }}
              run: npm run build

            - name: Build Docker image (verification only, not pushed yet)
              run:  docker build --build-arg DATABASE_URL="$DATABASE_URL" -t temp-${{ matrix.service }}-check ${{ matrix.service }}
                    